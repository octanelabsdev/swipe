site_name: swipe
site_description: Run Claude Code with the right account for every directory, and keep your commands, hooks and settings in one place. macOS, Linux and Windows.
site_url: https://swipe.octanelabs.dev/
repo_url: https://github.com/octanelabsdev/swipe
repo_name: octanelabsdev/swipe
edit_uri: edit/main/docs/
copyright: MIT-licensed. Built and maintained by Octane Labs.

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/mark.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - How it works: concepts.md
  - Guides:
      - Moving an existing setup: migrating.md
      - Sharing files between accounts: syncing.md
  - Reference:
      - Commands: commands.md
      - profiles.json: configuration.md
  - Help:
      - Troubleshooting & FAQ: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/syntax.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/octanelabsdev/swipe
