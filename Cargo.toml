[package]
name = "swipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[target."cfg(windows)".dependencies]
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
