[package]
name = "swipe"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Run Claude Code with the right account for every directory"
license = "MIT"
repository = "https://github.com/octanelabsdev/swipe"
homepage = "https://swipe.octanelabs.dev"
readme = "README.md"
keywords = ["claude", "claude-code", "cli", "profiles", "accounts"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
strip = true
lto = true

[dependencies]
anyhow = "1.0.104"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[target."cfg(windows)".dependencies]
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
